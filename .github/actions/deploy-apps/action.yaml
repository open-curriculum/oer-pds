# Deploy Apps
# deploys applications in dev and prod modes

name: Deploy Apps
description: Build and deploy a Vercel app from the provided app directory
inputs:
  vercel_token:
    description: 'Vercel API token used for pull, build, and deploy commands'
    required: true

  app_dir:
    description: 'Relative path to the app directory to build and deploy'
    required: true

  mode:
    description: 'Deployment mode to use for Vercel build and deploy steps'
    required: false
    default: 'dev'

runs:
  using: 'composite'

  steps:
    - name: Build App
      working-directory: ${{ inputs.app_dir }}
      run: pnpm build
      shell: bash

    - name: Install Vercel CLI
      run: pnpm add --global vercel@latest
      shell: bash

    - name: Pull Vercel Environment
      working-directory: ${{ inputs.app_dir }}
      run: vercel pull --yes --environment=preview --token=${{ inputs.vercel_token }}
      shell: bash

    - name: Vercel Build DEV
      if: ${{ inputs.mode == 'dev' }}
      working-directory: ${{ inputs.app_dir }}
      run: vercel build --token=${{ inputs.vercel_token }}
      shell: bash

    - name: Vercel Deploy DEV
      if: ${{ inputs.mode == 'dev' }}
      working-directory: ${{ inputs.app_dir }}
      run: vercel deploy --prebuilt --token=${{ inputs.vercel_token }}
      shell: bash
      
    - name: Vercel Build PROD
      if: ${{ inputs.mode == 'prod' }}
      working-directory: ${{ inputs.app_dir }}
      run: vercel build --prod --token=${{ inputs.vercel_token }}
      shell: bash

    - name: Vercel Deploy PROD
      if: ${{ inputs.mode == 'prod' }}
      working-directory: ${{ inputs.app_dir }}
      run: vercel deploy --prebuilt --prod --token=${{ inputs.vercel_token }}
      shell: bash
